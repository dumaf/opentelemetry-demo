[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eyes"
version = "0.1.0"
description = "Eyes: independent incident observation and blind fault detection for the OpenTelemetry Demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13.7",
  "aiosqlite>=0.20",
  "sqlalchemy>=2.0",
  "python-dotenv>=1.0",
  "apscheduler>=3.10",
  "prometheus-client>=0.20",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
faultcli = "faultcli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["eyes_core*", "faultcli*", "backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["faultcli/tests", "backend/tests", "tests"]
pythonpath = ["."]
